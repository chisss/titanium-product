spring:
  # 错误文案国际化（m30-07）：资源包位于 titanium-metadata 的 classpath:i18n/messages_*.properties，
  # basename 带 i18n/ 前缀而非裸 messages——裸 messages 会被 JDK ResourceBundle 在多个 jar 之间
  # 只取「第一个」命中者，第三方 jar 若也有根级 messages.properties 会静默顶掉本项目文案。
  messages:
    basename: i18n/messages
    encoding: UTF-8
  application:
    name: titanium-product-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/titanium_insurance?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
    username: root
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Axon 系统表加 axon_ 前缀，业务表不受影响
      naming:
        physical-strategy: com.titanium.common.jpa.AxonTablePrefixPhysicalNamingStrategy
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:liquibase/changelog-master.xml
    password: ${DB_PASSWORD:password}
  # Kafka 跨域事件外发(与 customer 域一致：String 序列化 + 应用侧 fastjson2 JSON)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # ✅ 本段**真实生效**：本域引入了 spring-boot-starter-kafka（KafkaProperties 所在的自动配置模块），
      #    且未自定义 ProducerFactory/KafkaTemplate。其余多数域是「裸 spring-kafka + 自定义 KafkaConfig」，
      #    其 yml 生产者段因自动配置退让而不被消费——本域相反，此段是生产者参数的事实来源。
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # fastjson2 生成的 JSON String 逐字节透传（ProductKafkaEventPublisher），禁用 JsonSerializer 二次编码
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # leader 需等全部同步副本确认，防 leader 切换时丢消息（Kafka 默认 acks=1 只等 leader 本地写入）
      acks: all
      # 生产者幂等：重试不产生重复消息（须与 acks=all 同开）
      enable-idempotence: true
      # 瞬时故障（网络抖动、leader 选举）自动重试，避免直接落入死信队列
      retries: 2147483647
    consumer:
      # m27-04/PKG-04：本地赔案投影消费组（claim-created / claim-updated /
      # claim-status-changed / claim-rejected 四主题，维护 t_product_claim_history_view）
      group-id: titanium-product-group
      # 入站统一 String 反序列化：由监听器按防腐入站 record 一次性解析，不依赖 JsonDeserializer 类型头
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 🔴 新建消费组首次启动从头消费：在 Kafka 保留期内回填历史赔案。
      #    保留期（默认 7 天）之外的历史不在投影内，R-3 启用 NCD 前须做一次性历史回填
      #    （见 ClaimHistoryAdapter 类注释与 ADR-0002）。
      auto-offset-reset: earliest

server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

axon:
  serializer:
    general: jackson
  eventhandling:
    processors:
      # ✅ m21-04（审查报告 ORC-01）：原 product-group 死配置已删除（m6-909 实读登记的死配置，
      #    全仓无处理器声明该组名；真实读侧组名为 product-query-group）。保留本行以留痕。
      # 跨域 Kafka 外发处理组（与写侧 product-group、读侧 product-query-group 隔离）
      # 🔴 tracking + DLQ（m6-909）：原为 subscribing——事件到达即同步发布、不经事件存储，看似更简单，
      #    但只有流式处理器（tracking/pooled-streaming）才支持 SequencedDeadLetterQueue，
      #    subscribing 拿不到 DLQ，发布失败即永久丢失（产品目录出口静默漏事件）。
      #    首启位点由顶层 titanium.axon.outbound-relay.groups 登记为事件流末端，避免重放全量历史产品事件。
      product-kafka-group:
        mode: tracking
        dlq:
          enabled: true
          max-size: 1000
        batchSize: 1
      # CQRS 读侧投影处理组（与写侧 product-group 隔离）；开启 DLQ 保障读模型投影最终一致
      product-query-group:
        dlq:
          enabled: true
          max-size: 1000
          cache:
            enabled: true
            size: 2048
        batchSize: 10
  eventbus:
    type: simple
  commandhandling:
    shutdown-timeout: 5000

logging:
  level:
    com.titanium: info
    org.axonframework: info
    org.springframework.data.jpa: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# 跨域出站中继：声明哪些处理组按「事件存储即 Outbox」形态装配为 tracking + DLQ，
# 并令其首启位点取事件流末端（避免首次部署重放全量历史产品事件）。
titanium:
  axon:
    outbound-relay:
      groups: [product-kafka-group]